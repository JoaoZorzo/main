<!doctype html>
<html lang="pt-BR" class="maintenance-app">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Maintenance Manager</title>

    <!-- CSS original -->
    <link rel="stylesheet" href="./assets/index.css">
  </head>

  <body>
    <style>
      astro-island, astro-slot, astro-static-slot { display: contents; }
    </style>

    <!-- runtime Astro -->
    <script>
      (() => {
        var e = async t => { await (await t())() };
        (self.Astro || (self.Astro = {})).only = e;
        window.dispatchEvent(new Event("astro:only"));
      })();
    </script>

    <!-- componente principal do app -->
    <astro-island
      uid="rehydrate"
      component-url="./assets/MaintenanceApp.js"
      component-export="default"
      renderer-url="./assets/client.js"
      props="{}"
      client="only"
      opts='{"name":"MaintenanceApp","value":"react"}'
    >
      <div style="padding:20px;font-family:system-ui">
        Carregando…
      </div>
    </astro-island>
  </body>
</html>
